<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi · isolated GUI probe</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:dark;background:#111316;color:#e8eaee}*{box-sizing:border-box}body{margin:0}main{max-width:960px;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:28px 28px 20px;gap:16px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #343a43;padding-bottom:18px}h1{font-size:23px;letter-spacing:-.04em;margin:0}small,.muted{color:#a7adb8}#status{border:1px solid #3b4550;border-radius:99px;padding:6px 12px;font-size:12px}#messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:15px;min-height:0;scrollbar-color:#48505b transparent}.message{max-width:80%;border-radius:15px;padding:13px 16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;background:#20252b}.message.user{align-self:flex-end;background:#213b39}.message.assistant{align-self:flex-start}.message.tool{font-size:13px;color:#b8c7d8;border:1px solid #3b4550;background:transparent;padding:8px 12px}.message.error{border:1px solid #ad6057;color:#ffd5cd}form{display:flex;gap:10px;align-items:end}textarea{resize:vertical;min-height:72px;max-height:180px;flex:1;border:1px solid #48515c;border-radius:13px;padding:13px;background:#191d22;color:inherit;font:inherit}button{border:0;border-radius:10px;background:#83d2bd;color:#10231f;padding:12px 18px;font-weight:650;cursor:pointer}button.stop{background:#313944;color:#e8eaee}button:disabled{opacity:.45;cursor:not-allowed}:focus-visible{outline:2px solid #83d2bd;outline-offset:3px}footer{font-size:12px;line-height:1.5;color:#a7adb8}@media(max-width:650px){main{padding:16px;gap:12px}.message{max-width:95%}form{flex-wrap:wrap}textarea{flex-basis:100%}header{gap:10px}h1{font-size:20px}}
</style></head><body><main><header><div><h1>Pi <span class="muted">/ isolated probe</span></h1><small>One ephemeral session · read-only tools · no ZCode Host</small></div><span id="status" role="status" aria-live="polite">Starting</span></header><section id="messages" role="log" aria-label="Conversation" aria-live="polite"></section><form id="composer"><textarea id="prompt" aria-label="Message to Pi" placeholder="Ask Pi to inspect the current checkout…" maxlength="8000" required></textarea><button id="send" type="submit">Send</button><button id="stop" class="stop" type="button" disabled>Stop</button></form><footer>This experiment runs Pi in read-only mode. Prompts and read tool results may be sent to your configured model provider. Session is discarded when the local server exits; do not use it for private projects.</footer></main><script src="app.js" defer></script></body></html>
